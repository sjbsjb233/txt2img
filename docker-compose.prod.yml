# Deploy on the production server. Watchtower follows the floating :stable tag
# (poll interval 5 min). To release a new version: push a v* tag in git;
# CI builds :v1.2.3 + :stable; Watchtower picks it up. To roll back:
# in GHCR's package UI, repoint :stable at an older :vX.Y.Z, or push a hot-fix tag.
#
# Setup:
#   1. cp backend.env.example backend.env   (fill in production JWT_SECRET / ADMIN_PASSWORD / CORS_ORIGINS)
#   2. docker login ghcr.io -u <github-user>    (use a PAT with read:packages)
#   3. docker compose -f docker-compose.prod.yml up -d
#
# Host ports default to uncommon numbers to avoid clashing with anything else
# on the box. Override via env vars to expose the standard ones, e.g.:
#   FRONTEND_PORT=80 docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ghcr.io/sjbsjb233/txt2img-backend:stable
    container_name: txt2img-backend
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      DB_URL: sqlite+aiosqlite:////app/data/txt2img.db
      # Structured-logging defaults (see backend/app/utils/logging_setup.py).
      # Logs land on the host at ./data/logs/backend/*.log through the
      # existing ./data:/app/data bind mount. Override via backend.env
      # if a host needs different retention / level.
      LOG_DIR: /app/data/logs/backend
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LOG_RETAIN_DAYS: 30
    volumes:
      # Bind-mount: everything the backend needs to persist (SQLite DB, generated
      # images, etc.) lives under ./data on the host so the whole project is in
      # one directory.
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/sjbsjb233/txt2img-frontend:stable
    container_name: txt2img-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: txt2img-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    command:
      - --label-enable
      - --interval=300
      - --cleanup
      - --rolling-restart
