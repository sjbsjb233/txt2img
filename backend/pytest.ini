[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:passlib.*
markers =
    p0: must pass on every PR
    p1: pre-release blocker
    p2: edge cases
    real: hits real upstream APIs (consumes quota)
    e2e: requires Playwright browser
    slow: takes > 5 seconds
    auth: AUTH domain
    user: USER domain
    tier: TIER domain
    prov: PROV domain
    adapt: ADAPT domain
    model: MODEL domain
    job: JOB domain
    sched: SCHED domain
    pen: PEN domain
    breaker: BREAK domain
    sse: SSE domain
    arch: ARCH domain
    img: IMG domain
    ann: ANN domain
    emerg: EMERG domain
    admin: ADMIN domain
    cross: CROSS domain
    err: ERR domain
