# Alembic configuration for the txt2img backend.
#
# The DB URL is intentionally NOT set here — env.py reads it from the
# application Settings (which sources `DB_URL` from the environment) so the
# same alembic invocation works for prod, dev, and tests without juggling
# config files.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
