name: build-dev

# Build dev images only when develop is updated (i.e. a PR is merged into develop).
# Open / synchronize / reopen events on PRs are deliberately NOT triggers.
on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (dev)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          target: dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/txt2img-${{ matrix.name }}:dev
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/txt2img-${{ matrix.name }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-dev
          provenance: false
