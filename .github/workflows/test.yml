# CI for the schema-driven Create-page test suite (test plan §9).
#
# Three jobs run in parallel; the e2e job depends on backend-tests
# passing first so a broken adapter doesn't waste browser-launch time.
#
# All three jobs are quick because the project uses sqlite locally —
# no external services. The e2e job seeds providers via the admin API
# inside Playwright fixtures.

name: test

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: vitest
        working-directory: frontend
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: run Playwright suite
        working-directory: frontend
        env:
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: test-admin-password
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
