name: build-prod

# Build prod images only when a v* tag is pushed (e.g. v1.2.3).
# Each release publishes two tags: an immutable :v1.2.3 (rollback target)
# plus the floating :stable that Watchtower follows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.2.3). Required for manual runs.'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Refusing to release without a v<MAJOR>.<MINOR>.<PATCH> tag (got '${VERSION}')."
            exit 1
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/txt2img-${{ matrix.name }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/txt2img-${{ matrix.name }}:stable
          cache-from: type=gha,scope=${{ matrix.name }}-prod
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-prod
          provenance: false
